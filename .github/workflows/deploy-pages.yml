name: Deploy VisionQuest Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vision-quest-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/react_app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/react_app
        run: npm ci

      - name: Typecheck
        working-directory: frontend/react_app
        run: npm run typecheck

      - name: Build static demo
        working-directory: frontend/react_app
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: frontend/react_app/dist
